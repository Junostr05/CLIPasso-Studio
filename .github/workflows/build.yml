name: Build CLIPasso Studio

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      cpu:
        description: "Build the CPU edition (portable exe + installer)"
        type: boolean
        default: true
      gpu:
        description: "Build the GPU (CUDA) edition"
        type: boolean
        default: true
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v2.0.0); empty = no release"
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release (experimental build, not 'latest')"
        type: boolean
        default: false
      benchmark:
        description: "Run the quality and speed benchmark (tools/benchmark.py)"
        type: boolean
        default: true

permissions:
  contents: read

# pushes cancel older pushes of the same branch; manual (release) runs are never cancelled by pushes
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff (version pinned in requirements/dev.txt)
        run: |
          pip install "$(grep -E '^ruff==' requirements/dev.txt)"
          ruff check .
      - name: The release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          version=$(python -c "import clipasso_studio; print(clipasso_studio.__version__)")
          echo "tag $TAG, app version $version"
          test "$TAG" = "v$version"

  test:
    name: Tests (Linux, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: System libraries for Qt
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/torch-cpu.txt
          pip install -r requirements/dev.txt
      - name: Browser for the phone page tests (tests/e2e)
        run: python -m playwright install --with-deps chromium
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
          restore-keys: models-v2-
      - name: Download models
        run: python tools/fetch_models.py
      - name: Unit tests (with the phone page in Chromium)
        run: python -m pytest -q -m "not slow" --durations=20
      - name: Self-test of all methods (from source)
        run: python -m clipasso_studio --selftest selftest_src
      - name: Slow end-to-end tests (all options)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python -m pytest -q -m slow
      - name: GUI smoke test (offscreen screenshots)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/screenshots.py screenshots --pages studio,studio:swiftsketch,studio:controlsketch,compare,queue,gallery,models,settings,about
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14

  benchmark:
    name: Benchmark (Linux, CPU)
    # quality and speed against benchmarks/baseline.json (tools/benchmark.py): for releases, tags and pushes
    # whose message contains [benchmark]
    if: (github.event_name == 'workflow_dispatch' && inputs.benchmark) || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/torch-cpu.txt
          pip install -r requirements/dev.txt
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-bench-v1-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
          restore-keys: |
            models-bench-v1-
            models-v2-
      - name: Download models
        # the bundled ones and those of SwiftSketch and SceneSketch (ControlSketch's ~3 GB are left out here)
        run: |
          python tools/fetch_models.py
          python tools/fetch_models.py --only swiftsketch:diffusion,swiftsketch:refine,lama,clip:ViT-L/14
      - name: Benchmark
        run: python tools/benchmark.py --cases clipasso,swiftsketch,scenesketch --out benchmark --summary "$GITHUB_STEP_SUMMARY"
      - name: Categories with the independent judge
        # one picture per category (object, portrait, animal, scene), graded by CLIP ViT-L/14 (tools/judge.py)
        if: always()
        run: python tools/benchmark.py --suite clipasso --quick --out benchmark/suite --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: benchmark
          retention-days: 30

  test-windows:
    name: Tests (Windows, CPU)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/torch-cpu.txt
          pip install -r requirements/dev.txt
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
          restore-keys: models-v2-
      - name: Download models
        run: python tools/fetch_models.py
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        # -v: the name of every test before it runs; faulthandler_timeout: the stacks of all threads when a test
        # takes over 4 minutes (a hanging test is ended by pytest-timeout after 10 – its own dump was lost)
        run: python -m pytest -v -m "not slow" --durations=20 -o faulthandler_timeout=240

  build-windows:
    name: Windows ${{ matrix.edition }}
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        edition: [cpu, gpu]
    env:
      EDITION: ${{ matrix.edition }}
      # the GPU edition is only built for tags and manual runs (it takes long and is ~3 GB)
      # the CPU edition can be skipped in manual runs (e.g. to add the GPU edition to an existing release)
      SKIP: ${{ (matrix.edition == 'gpu' && !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.gpu)) || (matrix.edition == 'cpu' && github.event_name == 'workflow_dispatch' && !inputs.cpu) }}
    steps:
      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip downloads
        if: env.SKIP != 'true'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-win-${{ matrix.edition }}-${{ hashFiles('requirements/*.txt') }}
          restore-keys: pip-win-${{ matrix.edition }}-
      - name: Disk space
        if: env.SKIP != 'true'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
      - name: Install dependencies
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # exactly the locked packages (tools/lock_requirements.py), checked against their hashes
          pip install --require-hashes -r requirements/lock-${{ matrix.edition }}.txt
          python -c "import torch; print('torch', torch.__version__, 'cuda build', torch.version.cuda)"
      - name: Cache models
        if: env.SKIP != 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
          restore-keys: models-v2-
      - name: Download models
        if: env.SKIP != 'true'
        run: python tools/fetch_models.py
      - name: PyInstaller (onedir, for the installer)
        if: env.SKIP != 'true'
        shell: pwsh
        env:
          MODE: onedir
          PYTHONHASHSEED: "0"  # (the same exe from build to build: small updates)
        run: pyinstaller --noconfirm --clean --workpath build\onedir --distpath dist packaging\clipasso_studio.spec
      - name: Self-test (onedir)
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CLIPassoStudio\CLIPassoStudio.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest_onedir" -Wait -PassThru -NoNewWindow
          Get-Content "$env:RUNNER_TEMP\selftest_onedir\selftest.log" -ErrorAction SilentlyContinue | Select-Object -Last 120
          Get-Content "$env:RUNNER_TEMP\selftest_onedir\selftest.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: PyTorch for older GPUs (CUDA 12.6 add-on)
        if: env.SKIP != 'true' && matrix.edition == 'gpu'
        shell: pwsh
        run: |
          # the exe downloads and unpacks the add-on like the app does, then must load PyTorch from it
          # (not the bundled one) in itself and in its worker processes; no GPU here: the self-test runs on the CPU
          $rt = "$env:RUNNER_TEMP\gpu_runtime"
          $exe = "dist\CLIPassoStudio\CLIPassoStudio.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--gpu-runtime-install", $rt -Wait -PassThru -NoNewWindow
          Get-Content "$rt\install.log" -Tail 15 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "installing the add-on failed" }
          $env:CLIPASSO_GPU_RUNTIME = (Get-ChildItem $rt -Directory | Where-Object Name -like "torch-*").FullName
          $p = Start-Process -FilePath $exe -ArgumentList "--gpu-runtime-check", "$env:RUNNER_TEMP\gpu_runtime.json" -Wait -PassThru -NoNewWindow
          Get-Content "$env:RUNNER_TEMP\gpu_runtime.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "the add-on's PyTorch was not used" }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest_runtime" -Wait -PassThru -NoNewWindow
          Get-Content "$env:RUNNER_TEMP\selftest_runtime\selftest.log" -Tail 40 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test with the add-on failed" }
          Remove-Item -Recurse -Force $rt
      - name: PyInstaller (onefile portable exe)
        if: env.SKIP != 'true' && matrix.edition == 'cpu'
        shell: pwsh
        env:
          MODE: onefile
          PYTHONHASHSEED: "0"  # (the same exe from build to build: small updates)
        run: |
          Remove-Item -Recurse -Force build\onedir -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --workpath build\onefile --distpath dist packaging\clipasso_studio.spec
      - name: Self-test (portable exe)
        if: env.SKIP != 'true' && matrix.edition == 'cpu'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CLIPassoStudio-CPU-Portable.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest_onefile" -Wait -PassThru -NoNewWindow
          Get-Content "$env:RUNNER_TEMP\selftest_onefile\selftest.log" -ErrorAction SilentlyContinue | Select-Object -Last 120
          Get-Content "$env:RUNNER_TEMP\selftest_onefile\selftest.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "portable self-test failed with exit code $($p.ExitCode)" }
      - name: Inno Setup installer
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ed = "${{ matrix.edition }}".ToUpper()
          $version = (python -c "import clipasso_studio; print(clipasso_studio.__version__)")
          & $iscc /Q "/DEdition=$ed" "/DAppVersion=$version" "/DSourceDir=$pwd\dist\CLIPassoStudio" "/DOutputDir=$pwd\release" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (Test-Path "dist\CLIPassoStudio-CPU-Portable.exe") { Move-Item "dist\CLIPassoStudio-CPU-Portable.exe" release\ }
          if ("${{ matrix.edition }}" -eq "cpu") {
            # the portable ZIP: the same onedir build (starts faster than the single exe), marked so that
            # its updates are unpacked next to it (clipasso_studio/gui/updates.py PORTABLE_MARKER)
            Set-Content -Path "dist\CLIPassoStudio\portable.txt" -Value "CLIPasso Studio, portable (ZIP). Settings and models: %LOCALAPPDATA%\CLIPassoStudio"
            7z a -tzip -mx=5 "release\CLIPassoStudio-CPU-Portable.zip" ".\dist\CLIPassoStudio" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          }
          Get-ChildItem release | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          foreach ($f in Get-ChildItem release) { if ($f.Length -ge 2147483648) { throw "$($f.Name) is larger than 2 GiB" } }
      - name: File list and small update from the previous release
        # tools/manifest.py: the file list of this build goes with the release; a release after one that has
        # a file list also gets a patch with only the changed files (installer: patch.iss, portable ZIP)
        if: env.SKIP != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          $ed = "${{ matrix.edition }}".ToUpper()
          $version = (python -c "import clipasso_studio; print(clipasso_studio.__version__)")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force build | Out-Null
          python tools/manifest.py build dist\CLIPassoStudio --edition $ed --version $version --out "release\CLIPassoStudio-$ed-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw "manifest failed" }
          if (-not $env:TAG) { exit 0 }
          python tools/manifest.py previous --edition $ed --tag $env:TAG --repo "${{ github.repository }}" --out build\prev.json
          if ($LASTEXITCODE -ne 0) { throw "reading the previous release failed" }
          if (-not (Test-Path build\prev.json)) { exit 0 }
          $info = python tools/manifest.py patch build\prev.json "release\CLIPassoStudio-$ed-manifest.json" dist\CLIPassoStudio build\patch | ConvertFrom-Json
          $info | Format-List
          if (-not $info.ok) { "the changes are too large for a patch – full files only"; exit 0 }
          & $iscc /Q "/DEdition=$ed" "/DAppVersion=$version" "/DFromVersion=$($info.from)" "/DPatchDir=$pwd\build\patch" "/DRemovedList=$pwd\build\patch-removed.iss" "/DOutputDir=$pwd\release" packaging\patch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (patch) failed" }
          if ($ed -eq "CPU") {
            New-Item -ItemType Directory -Force build\patchzip | Out-Null
            Copy-Item -Recurse build\patch build\patchzip\CLIPassoStudio
            7z a -tzip -mx=5 "release\CLIPassoStudio-CPU-Portable-Patch-from-$($info.from).zip" ".\build\patchzip\CLIPassoStudio" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z (patch) failed" }
          }
          Get-ChildItem release | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - name: Small update test (install, patch, self-test, uninstall)
        # a patch from a stand-in previous version (this build with three files "changed" and one file more):
        # it must update the installation, delete the extra file, refuse another version, and the patched
        # app and its uninstaller must work
        if: env.SKIP != 'true' && matrix.edition == 'cpu'
        shell: pwsh
        run: |
          $version = (python -c "import clipasso_studio; print(clipasso_studio.__version__)")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $inst = "$env:RUNNER_TEMP\patchtest_app"
          New-Item -ItemType Directory -Force build | Out-Null
          python tools/manifest.py fake-previous release\CLIPassoStudio-CPU-manifest.json --version $version --out build\fake-prev.json
          $info = python tools/manifest.py patch build\fake-prev.json release\CLIPassoStudio-CPU-manifest.json dist\CLIPassoStudio build\ptest | ConvertFrom-Json
          $info | Format-List
          if (-not $info.ok -or $info.changed -lt 3 -or $info.removed -ne 1) { throw "unexpected patch: $info" }
          & $iscc /Q "/DEdition=CPU" "/DAppVersion=$version" "/DFromVersion=$version" "/DPatchDir=$pwd\build\ptest" "/DRemovedList=$pwd\build\ptest-removed.iss" "/DOutputDir=$pwd\build\ptest-out" packaging\patch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (test patch) failed" }
          & $iscc /Q "/DEdition=CPU" "/DAppVersion=$version" "/DFromVersion=0.0.1" "/DPatchDir=$pwd\build\ptest" "/DRemovedList=$pwd\build\ptest-removed.iss" "/DOutputDir=$pwd\build\ptest-wrong" packaging\patch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC (wrong-version patch) failed" }
          $p = Start-Process "release\CLIPassoStudio-CPU-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing failed: $($p.ExitCode)" }
          Set-Content "$inst\_internal\left_from_the_previous_version.txt" "old"
          $p = Start-Process "build\ptest-wrong\CLIPassoStudio-CPU-Patch-from-0.0.1.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "a patch for another version was installed" }
          $p = Start-Process "build\ptest-out\CLIPassoStudio-CPU-Patch-from-$version.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the patch failed: $($p.ExitCode)" }
          if (Test-Path "$inst\_internal\left_from_the_previous_version.txt") { throw "the patch did not delete the removed file" }
          $p = Start-Process "$inst\CLIPassoStudio.exe" -ArgumentList "--selftest", "$env:RUNNER_TEMP\selftest_patched" -Wait -PassThru -NoNewWindow
          Get-Content "$env:RUNNER_TEMP\selftest_patched\selftest.json" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test of the patched app failed" }
          $p = Start-Process "$inst\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstalling failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$inst\CLIPassoStudio.exe") { throw "the uninstaller left the app" }
      - uses: actions/upload-artifact@v4
        if: env.SKIP != 'true'
        with:
          name: CLIPassoStudio-${{ matrix.edition }}
          path: release/*
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    needs: [test, test-windows, build-windows, benchmark]
    # (the benchmark may be skipped, but not fail)
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: CLIPassoStudio-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          # one checksum file per edition, so a later GPU-only run does not replace the CPU checksums
          for ed in CPU GPU; do
            if ls CLIPassoStudio-$ed-* >/dev/null 2>&1; then sha256sum CLIPassoStudio-$ed-* > SHA256SUMS-$ed.txt; fi
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: CLIPasso Studio ${{ env.TAG }}
          body_path: packaging/release_notes.md
          files: artifacts/*
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          make_latest: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
