name: macOS

# The Mac app (docs/macos/plan.md): its engine on Apple Silicon – tests and the measurement of the CPU against the
# Apple GPU (MPS). The Windows build (build.yml) is not touched by this workflow.
on:
  push:
    branches: ["**"]
    paths:
      - "clipasso_studio/**"
      - "macos/**"
      - "tests/**"
      - "tools/bench_device.py"
      - "tools/fetch_models.py"
      - "requirements/macos.txt"
      - "requirements/lock-macos.txt"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
    inputs:
      bench_methods:
        description: "Methods to measure (comma-separated)"
        type: string
        default: "clipasso,swiftsketch"
      bench_repeats:
        description: "Repeats per method, device and image"
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false  # a run under way (e.g. a measurement) finishes; only one waits behind it

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    shell: bash  # (= bash -eo pipefail: a step piped into tee fails when its command fails)

jobs:
  core:
    name: StudioCore (Swift package, macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i -E "beta|release_candidate|_rc" | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - uses: actions/setup-python@v5  # (the tests start the real engine: python3 -m clipasso_studio.headless)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: swift build and swift test
        working-directory: macos
        env:
          STUDIOCORE_EXPORT_DIR: ${{ runner.temp }}/studiocore-export  # what Swift wrote, for Python to read
        run: |
          swift build
          swift test
      - name: Python reads the job files Swift wrote
        run: python tools/check_swift_meta.py "${{ runner.temp }}/studiocore-export"

  app:
    name: The app (macOS, unsigned)
    runs-on: macos-26
    needs: core
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i -E "beta|release_candidate|_rc" | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-python@v5  # (only for the build scripts: the app gets its own Python)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: xcodebuild (the app and its tests)
        working-directory: macos
        run: |
          xcodebuild -scheme CLIPassoStudio -destination 'platform=macOS,arch=arm64' -derivedDataPath ../build/dd build
          xcodebuild -scheme StudioCore-Package -destination 'platform=macOS,arch=arm64' -derivedDataPath ../build/dd test
      - name: Cache the Python download
        uses: actions/cache@v4
        with:
          path: build/app/.cache
          key: macos-pbs-${{ hashFiles('macos/scripts/build_python.sh') }}
      - name: The app's own Python with the engine
        run: macos/scripts/build_python.sh build/app
      - name: CLIPasso Studio.app
        run: macos/scripts/make_app.sh build/app | tee app.txt
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: macos-models-v1-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
          restore-keys: macos-models-v1-
      - name: Models for the self-test (downloaded as a user's app would)
        run: PYTHONPATH="$PWD" build/app/python/bin/python3 tools/fetch_models.py
      - name: Self-test of the app (a small CLIPasso job, the engine started as the window starts it)
        run: |
          "build/app/CLIPasso Studio.app/Contents/MacOS/CLIPassoStudio" --self-test \
            clipasso_studio/resources/samples/camel.png "$RUNNER_TEMP/selftest" --models "$PWD/models" | tee selftest.txt
      - name: Screenshots of every page (German, English; dark, light)
        if: success() || failure()
        continue-on-error: true  # (needs the runner's window session; the app and its disk image do not)
        timeout-minutes: 10
        run: |
          "build/app/CLIPasso Studio.app/Contents/MacOS/CLIPassoStudio" --screenshots "$RUNNER_TEMP/shots" \
            --results "$RUNNER_TEMP/selftest"
          ls "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: screenshots-mac
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn
      - name: Disk image
        run: macos/scripts/make_dmg.sh build/app | tee dmg.txt
      - name: Sizes and self-test in the summary
        run: |
          {
            echo "## The app"; echo
            echo "- .app: $(tail -2 app.txt | head -1 | cut -f1)"
            echo "- disk image: $(head -1 dmg.txt)"
            echo; echo '```'; cat selftest.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: CLIPasso-Studio-mac
          path: build/app/CLIPasso-Studio-*-mac.dmg
          if-no-files-found: error

  engine:
    name: Engine (macOS, Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/macos.txt
      - name: Install the engine (and the test tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/macos.txt
          python -m pip install "$(grep -E '^pytest-timeout==' requirements/dev.txt)" "pytest>=8" \
            "$(grep -E '^PySide6-Essentials==' requirements/app.txt)"
      - name: The machine and its devices
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          python -c "import platform, torch; print(platform.platform(), platform.machine()); print('torch', torch.__version__, '· MPS built', torch.backends.mps.is_built(), '· MPS available', torch.backends.mps.is_available())"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: macos-models-v1-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
          restore-keys: macos-models-v1-
      - name: Download models
        run: |
          python tools/fetch_models.py
          python tools/fetch_models.py --only swiftsketch:diffusion,swiftsketch:refine,birefnet
      - name: Tests of the engine for the Mac app
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q --durations=15
          tests/test_schema_conditions.py tests/test_headless_export.py tests/test_headless_protocol.py
          tests/test_headless_server.py tests/test_headless_e2e.py tests/test_runner_orphans.py
          tests/test_device_mps.py tests/test_bench_device.py tests/test_settings.py
      - name: Measure the CPU against the Apple GPU
        if: success() || failure()  # (the numbers help most when a test failed)
        run: |
          python tools/bench_device.py --methods "${{ inputs.bench_methods || 'clipasso,swiftsketch' }}" \
            --devices cpu,mps --repeats "${{ inputs.bench_repeats || 1 }}" --iters 200 --out bench.json > bench.md
          cat bench.md
          { echo "## CPU against the Apple GPU (MPS)"; echo; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-macos
          path: |
            bench.json
            bench.md
          if-no-files-found: ignore
