name: Windows engine

# The headless engine of the Mac app (clipasso_studio/headless) on Windows, in a few minutes – the same tests run
# in the full Windows test job of build.yml, which takes 40 minutes and is not changed by this workflow.
on:
  push:
    branches: ["**"]
    paths:
      - "clipasso_studio/headless/**"
      - "clipasso_studio/engine/runner.py"
      - "tests/headless_engine.py"
      - "tests/test_headless_*.py"
      - "tests/test_runner_orphans.py"
      - ".github/workflows/windows-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless engine (Windows, CPU)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies (as the Windows tests of build.yml)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/torch-cpu.txt
          pip install -r requirements/dev.txt
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ hashFiles('clipasso_studio/engine/model_store.py') }}
      - name: Download models
        run: python tools/fetch_models.py
      - name: Tests of the headless engine
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -v -rA --durations=10 -o faulthandler_timeout=240
          tests/test_headless_server.py tests/test_headless_e2e.py tests/test_runner_orphans.py
