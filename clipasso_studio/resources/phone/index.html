<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CLIPasso Studio</title>
<link rel="stylesheet" href="/phone.css">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#14161b">
</head>
<body>
<script id="cfg" type="application/json">{{config}}</script>

<header id="top">
  <div class="toprow">
    <div class="brand">CLIPasso Studio</div>
    <div class="topbtns">
      <button id="pause" class="small" disabled></button>
      <button id="cancel" class="small" disabled></button>
    </div>
  </div>
  <div id="status" class="muted one-line">…</div>
  <button id="to-live" class="live" hidden></button>
  <div class="bar"><div id="progress"></div></div>
</header>

<main>
  <!-- ======================================================== studio -->
  <section id="tab-studio" class="tab">
    <div class="card" id="picture-card">
      <h2 data-t="picture"></h2>
      <div class="input-wrap"><img id="input" alt=""><div id="no-input" class="muted center" data-t="no_picture"></div></div>
      <div id="input-name" class="muted one-line"></div>
      <div class="row wrap">
        <label class="btn" for="camera"><span data-t="camera"></span>
          <input id="camera" type="file" accept="image/*" capture="environment" hidden></label>
        <label class="btn" for="choose"><span data-t="choose"></span>
          <input id="choose" type="file" accept="image/*" hidden></label>
        <button id="from-pc" data-t="from_pc"></button>
      </div>
      <div class="row wrap">
        <button id="crop" class="small" data-t="crop"></button>
        <button id="mask" class="small" data-t="mask_show" hidden></button>
        <button id="mask-edit" class="small" data-t="mask_edit" hidden></button>
        <span id="mask-state" class="muted small-text"></span>
      </div>
      <div id="hints" class="hints"></div>
      <div id="history" hidden>
        <div id="history-title" class="sub"></div>
        <div id="history-list" class="history"></div>
      </div>
      <div id="upload-msg" class="muted"></div>
      <div id="pc-images" hidden>
        <div class="sub" data-t="recent"></div><div id="recent" class="grid"></div>
        <div class="sub" data-t="samples"></div><div id="samples" class="grid"></div>
      </div>
    </div>

    <div class="card" id="method-card">
      <h2 data-t="method"></h2>
      <div id="methods" class="methods"></div>
      <div id="missing" class="warn" hidden>
        <div id="missing-text"></div>
        <div class="row"><button id="download" class="primary small"></button></div>
      </div>
      <div id="downloading" class="warn" hidden>
        <div id="download-text"></div>
        <div class="bar"><div id="download-bar"></div></div>
        <div class="row"><button id="download-cancel" class="small" data-t="cancel"></button></div>
      </div>
    </div>

    <div class="card" id="preset-card">
      <h2 data-t="preset"></h2>
      <div id="presets" class="seg"></div>
      <div class="sub" data-t="my_presets"></div>
      <div id="user-presets" class="mine"></div>
      <form id="preset-form" class="row" autocomplete="off">
        <input id="preset-name" type="text" maxlength="40" enterkeyhint="done">
        <button id="preset-save" class="primary small" type="submit" data-t="preset_save"></button>
      </form>
      <div class="muted small-text" data-t="preset_save_hint"></div>
      <div class="sub" data-t="budget_title"></div>
      <div class="row wrap" id="budget">
        <button data-min="5">5 min</button><button data-min="15">15 min</button><button data-min="60">60 min</button>
        <input id="budget-min" type="number" min="1" max="1440" inputmode="numeric" class="num" placeholder="min">
        <button id="budget-go" data-t="budget_apply"></button>
      </div>
    </div>

    <div class="card" id="details-card">
      <h2 data-t="details"></h2>
      <div id="details-state" class="muted"></div>
      <div class="row wrap">
        <button id="paint" data-t="details_paint"></button>
        <button id="face" data-t="face"></button>
        <button id="details-clear" data-t="details_clear"></button>
      </div>
    </div>

    <details class="card compare" id="compare-card">
      <summary><h2 data-t="compare"></h2></summary>
      <div class="muted small-text" data-t="compare_hint"></div>
      <div id="compare-methods" class="flags-row"></div>
      <label class="check"><input id="compare-studio" type="checkbox"><span data-t="compare_studio"></span></label>
      <div class="row"><button id="compare-go" class="primary" data-t="compare_go"></button></div>
      <div id="compare-results" class="compare-grid"></div>
      <div id="compare-verdict" class="muted"></div>
    </details>

    <div class="card" id="params-card">
      <div class="row between"><h2 data-t="params"></h2><button id="reset" class="small" data-t="reset"></button></div>
      <label class="check"><input id="advanced" type="checkbox"><span data-t="advanced"></span></label>
      <div id="params"></div>
      <button id="to-preset" class="wide" data-t="save_preset"></button>
    </div>

    <div class="startbar" id="startbar">
      <div id="estimate" class="muted center"></div>
      <div class="row">
        <button id="start" class="primary" data-t="start"></button>
        <button id="queue-add" data-t="add_queue"></button>
      </div>
      <div id="start-msg" class="muted center"></div>
      <div id="memory" class="warn" hidden>
        <div id="memory-text"></div>
        <div class="row wrap"><button id="mem-smaller" class="primary"></button>
          <button id="mem-anyway" data-t="anyway"></button></div>
      </div>
    </div>
  </section>

  <!-- ======================================================== sketch -->
  <section id="tab-sketch" class="tab" hidden>
    <div class="card" id="sketch-card">
      <div class="row between"><div id="view-name" class="muted one-line"></div>
        <button id="full" class="small desk-only" data-t="full_screen"></button></div>
      <div id="views" class="seg views" hidden>
        <button data-v="sketch" class="on" data-t="view_sketch"></button>
        <button data-v="compare" data-t="view_compare"></button>
        <button data-v="attention" data-t="view_attention"></button>
        <button data-v="mask" data-t="view_mask"></button>
        <button data-v="condition" data-t="view_condition"></button>
        <button data-v="all" data-t="view_all"></button>
      </div>
      <div id="scene-views" class="seg views" hidden>
        <button data-view="sketch" class="on" data-t="view_sketch"></button>
        <button data-view="background" data-t="view_background"></button>
        <button data-view="matrix" data-t="view_matrix"></button>
      </div>
      <div id="scene-part" class="phase" hidden></div>
      <div id="sketch-box" class="preview"><img id="sketch" alt="">
        <canvas id="edit-canvas" class="edit-canvas" hidden></canvas>
        <div id="no-sketch" class="muted center" data-t="no_sketch"></div></div>
      <div id="compare-view" class="preview split" hidden><img id="split-photo" alt=""><img id="split-sketch" alt=""></div>
      <input id="split" class="split-range" type="range" min="0" max="100" value="50" hidden>
      <div id="plain-view" class="preview" hidden><img id="plain-img" alt=""></div>
      <div id="all-view" class="sheet-grid" hidden></div>
      <div id="background-box" class="preview" hidden><img id="scene-bg" alt="">
        <div id="no-bg" class="muted center" data-t="no_background_yet"></div></div>
      <div id="matrix-box" class="matrix-box" hidden>
        <div class="axis-x"></div>
        <div class="matrix-wrap"><div class="axis-y"></div><div id="matrix" class="matrix"></div></div>
        <div class="muted small-text" data-t="matrix_hint"></div>
      </div>
      <div id="layer-switch" class="seg layers" hidden>
        <button data-part="all" class="on" data-t="layer_all"></button>
        <button data-part="background" data-t="layer_background"></button>
        <button data-part="object" data-t="layer_object"></button>
      </div>
      <div id="edit-tools" class="edit-tools" hidden>
        <div class="seg">
          <button id="tool-erase" data-t="edit_eraser"></button>
          <button id="tool-pen" data-t="edit_pen"></button>
          <button id="edit-undo" class="small" aria-label="undo">↶</button>
          <button id="edit-redo" class="small" aria-label="redo">↷</button>
          <button id="edit-revert" class="small" data-t="edit_revert"></button>
        </div>
        <div class="row wrap">
          <button id="open-simplify" class="small" data-t="edit_simplify"></button>
          <button id="open-steps" class="small" data-t="edit_steps"></button>
          <button id="play-lapse" class="small" data-t="edit_lapse"></button>
          <select id="lapse-speed" class="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option>
            <option value="2">2×</option><option value="4">4×</option></select>
          <button id="rerun-cell" class="small" data-t="rerun_cell" hidden></button>
        </div>
        <div id="edit-hint" class="muted small-text"></div>
        <div id="edit-panel" class="edit-panel" hidden>
          <div class="row between"><b id="edit-panel-title"></b><span id="edit-panel-value" class="muted"></span></div>
          <input id="edit-slider" type="range" min="0" max="0" value="0">
          <div id="edit-panel-note" class="muted small-text"></div>
          <div class="row"><button id="edit-apply" class="primary"></button><button id="edit-close" data-t="close"></button></div>
        </div>
        <details id="continue-box" class="group">
          <summary data-t="edit_continue"></summary>
          <div class="muted small-text" data-t="edit_continue_hint"></div>
          <div class="row"><span class="muted grow" data-t="edit_new_strokes"></span>
            <input id="cont-new" type="number" class="num" min="0" max="128" inputmode="numeric"></div>
          <div class="row"><span class="muted grow" data-t="edit_iterations"></span>
            <input id="cont-iter" type="number" class="num" min="1" max="20000" inputmode="numeric"></div>
          <label class="check"><input id="cont-keep" type="checkbox" checked><span data-t="edit_keep_drawn"></span></label>
          <div class="row"><button id="cont-go" class="primary" data-t="edit_continue_go"></button></div>
        </details>
      </div>
      <div id="seeds" class="seeds"></div>
      <div id="stats" class="stats"></div>
      <button id="continue" class="primary" data-t="continue" hidden></button>
    </div>
    <div class="card" id="rate-card">
      <h2 data-t="rating"></h2>
      <div class="row"><button id="up" class="thumb">👍</button><button id="down" class="thumb">👎</button></div>
      <div id="taste" class="muted"></div>
    </div>
    <div class="card" id="look-card">
      <h2 data-t="look"></h2>
      <div class="field"><label data-t="style"></label><select id="style"></select></div>
      <div class="field"><label data-t="paper"></label><select id="paper"></select></div>
      <div class="row wrap">
        <label class="check grow"><input id="vignette" type="checkbox"><span data-t="x_vignette"></span></label>
        <input id="paper-color" type="color" class="color-sm" aria-label="color">
        <button id="paper-color-reset" class="small" data-t="paper_color_reset"></button>
      </div>
      <div class="row wrap">
        <a id="dl-svg" class="btn" download data-t="download_svg"></a>
        <a id="dl-png" class="btn" download data-t="download_png"></a>
      </div>
    </div>
    <div class="card" id="export-card" hidden>
      <h2 data-t="export"></h2>
      <div id="formats" class="chips"></div>
      <div id="fmt-desc" class="muted small-text"></div>
      <div id="export-opts" class="xopts"></div>
      <div class="row">
        <button id="export-go" class="primary"></button>
        <button id="export-cancel" data-t="cancel" hidden></button>
      </div>
      <div id="export-state" hidden>
        <div class="bar"><div id="export-progress"></div></div>
        <div id="export-msg" class="muted"></div>
      </div>
      <a id="export-dl" class="btn primary wide" hidden></a>
    </div>
  </section>

  <!-- ======================================================== gallery -->
  <section id="tab-gallery" class="tab" hidden>
    <div class="card">
      <h2 data-t="results"></h2>
      <input id="search" type="search" enterkeyhint="search" autocomplete="off">
      <div class="row filters">
        <select id="filter-method"></select>
        <select id="filter-album"></select>
        <button id="filter-fav" class="small fav-filter">☆</button>
      </div>
      <div class="row filters">
        <select id="sort"></select>
        <select id="filter-tag"></select>
      </div>
      <div class="row wrap">
        <button id="album-new" class="small" data-t="album_new"></button>
        <button id="album-rename" class="small" data-t="album_rename" hidden></button>
        <button id="album-delete" class="small" data-t="album_delete" hidden></button>
      </div>
      <div id="results-count" class="muted small-text"></div>
      <div id="results" class="results"></div>
      <button id="more" class="wide" data-t="more" hidden></button>
    </div>
  </section>

  <!-- ======================================================== queue -->
  <section id="tab-queue" class="tab" hidden>
    <div class="card">
      <div class="row between"><h2 data-t="tab_queue"></h2>
        <button id="clear-queue" class="small" data-t="clear_done" hidden></button></div>
      <label class="btn wide" for="many"><span data-t="add_many"></span>
        <input id="many" type="file" accept="image/*" multiple hidden></label>
      <div id="many-msg" class="muted small-text"></div>
      <div class="row wrap">
        <label class="check grow"><input id="auto-start" type="checkbox"><span data-t="auto_start"></span></label>
        <select id="done-action" class="done-action" hidden></select>
      </div>
      <div id="queue-total" class="muted small-text"></div>
      <div id="jobs"></div>
    </div>
  </section>

  <!-- ======================================================== the studio on a wide screen: three columns -->
  <div id="desk" class="desk-grid" hidden>
    <div id="desk-left" class="col"></div><div id="desk-center" class="col"></div><div id="desk-right" class="col"></div>
  </div>

  <!-- ======================================================== the app: version and updates -->
  <section id="tab-app" class="tab" hidden>
    <div class="card">
      <h2 data-t="layout_title"></h2>
      <div id="layout" class="seg">
        <button data-layout="auto" data-t="layout_auto"></button>
        <button data-layout="phone" data-t="layout_phone"></button>
        <button data-layout="studio" data-t="layout_studio"></button>
      </div>
      <div class="muted small-text" data-t="layout_hint"></div>
      <div class="sub" data-t="page_theme"></div>
      <div id="page-theme" class="seg">
        <button data-theme="auto" data-t="theme_browser"></button>
        <button data-theme="app" data-t="theme_app"></button>
        <button data-theme="light" data-t="theme_light"></button>
        <button data-theme="dark" data-t="theme_dark"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="app_settings"></h2>
      <div class="muted small-text" data-t="app_settings_hint"></div>
      <div id="app-settings"></div>
    </div>
    <div class="card">
      <h2 data-t="models_title"></h2>
      <div id="studio-models-title" class="sub"></div>
      <div id="studio-models"></div>
      <div id="models-download" class="warn" hidden></div>
      <div id="model-list"></div>
    </div>
    <div class="card">
      <h2 data-t="app_title"></h2>
      <div class="row between"><span class="muted" data-t="app_version"></span><b id="app-version"></b></div>
      <div id="update-last" class="warn" hidden></div>
      <div id="update-msg" class="muted update-msg"></div>
      <div id="update-bar" class="bar" hidden><div id="update-progress"></div></div>
      <div id="update-hint" class="muted small-text" hidden></div>
      <details id="update-notes-box" class="group" hidden>
        <summary data-t="update_notes"></summary>
        <div id="update-notes" class="notes small-text"></div>
      </details>
      <div class="row wrap">
        <button id="update-check" data-t="update_check"></button>
        <button id="update-install" class="primary" hidden></button>
        <button id="update-cancel" class="small" data-t="cancel" hidden></button>
      </div>
    </div>
  </section>
</main>

<nav id="tabs">
  <button data-tab="studio" class="on"><span>✎</span><span data-t="tab_studio"></span></button>
  <button data-tab="sketch"><span>◐</span><span data-t="tab_sketch"></span></button>
  <button data-tab="gallery"><span>▦</span><span data-t="tab_gallery"></span></button>
  <button data-tab="queue"><span>☰</span><span data-t="tab_queue"></span></button>
  <button data-tab="app"><span>⚙</span><span data-t="tab_app"></span></button>
</nav>

<!-- ========================================================== detail brush -->
<div id="painter" class="sheet" hidden>
  <div class="sheet-head">
    <b data-t="detail_title"></b>
    <button id="paint-close" class="small" data-t="close"></button>
  </div>
  <div class="muted small-text" data-t="detail_hint"></div>
  <div class="paint-area"><canvas id="paint-canvas"></canvas></div>
  <div id="tools" class="seg">
    <button data-tool="255" class="on" data-t="tool_more"></button>
    <button data-tool="128" data-t="tool_normal"></button>
    <button data-tool="0" data-t="tool_less"></button>
  </div>
  <div class="row"><span class="muted" data-t="brush_size"></span><input id="brush" type="range" min="2" max="40" value="8"></div>
  <div class="row wrap">
    <button id="paint-face" data-t="face"></button>
    <button id="paint-undo" data-t="undo"></button>
    <button id="paint-clear" data-t="details_clear"></button>
    <button id="paint-save" class="primary" data-t="save"></button>
  </div>
  <div id="paint-msg" class="muted"></div>
</div>

<!-- ========================================================== a result large -->
<div id="viewer" class="sheet viewer" hidden>
  <div class="sheet-head">
    <b id="viewer-name" class="one-line"></b>
    <button id="viewer-close" class="small" data-t="close"></button>
  </div>
  <div id="viewer-info" class="muted small-text"></div>
  <div class="viewer-box"><img id="viewer-img" alt=""></div>
  <div class="muted small-text center" data-t="viewer_hint"></div>
  <div class="row wrap">
    <button id="viewer-open" class="primary" data-t="open_studio"></button>
    <button id="viewer-fav" class="small"></button>
    <button id="viewer-delete" class="small">🗑</button>
  </div>
  <div id="viewer-tags" class="muted small-text"></div>
  <div class="row wrap">
    <button id="viewer-info-edit" class="small" data-t="info_edit"></button>
    <select id="viewer-album" class="done-action"></select>
    <button id="viewer-continue" class="small" data-t="continue" hidden></button>
    <button id="viewer-pair" class="small"></button>
    <button id="viewer-show" class="small" data-t="slideshow"></button>
  </div>
  <form id="info-form" class="info-form" hidden autocomplete="off">
    <input id="info-title" type="text" maxlength="120">
    <input id="info-tags" type="text" maxlength="400">
    <textarea id="info-notes" rows="3" maxlength="4000"></textarea>
    <div class="row"><button class="primary" type="submit" data-t="save"></button>
      <button id="info-cancel" type="button" data-t="cancel"></button></div>
  </form>
</div>

<!-- ========================================================== two results with a divider -->
<div id="pair" class="sheet" hidden>
  <div class="sheet-head">
    <b data-t="pair_title"></b>
    <button id="pair-close" class="small" data-t="close"></button>
  </div>
  <div class="preview split pair"><img id="pair-a" alt=""><img id="pair-b" alt=""></div>
  <input id="pair-split" class="split-range" type="range" min="0" max="100" value="50">
  <div class="row between muted small-text"><span id="pair-a-name"></span><span id="pair-b-name"></span></div>
</div>

<!-- ========================================================== crop / turn the picture -->
<div id="cropper" class="sheet" hidden>
  <div class="sheet-head">
    <b data-t="crop_title"></b>
    <button id="crop-close" class="small" data-t="close"></button>
  </div>
  <div class="muted small-text" data-t="crop_hint"></div>
  <div class="paint-area"><canvas id="crop-canvas"></canvas></div>
  <div class="row wrap">
    <button id="crop-left" class="small">⟲</button>
    <button id="crop-right" class="small">⟳</button>
    <button id="crop-flip" class="small">⇋</button>
    <button id="crop-reset" class="small" data-t="crop_reset"></button>
    <button id="crop-apply" class="primary" data-t="crop_apply"></button>
  </div>
  <div id="crop-msg" class="muted"></div>
</div>

<!-- ========================================================== the PIN before an update -->
<div id="pin-sheet" class="sheet" hidden>
  <div class="sheet-head">
    <b data-t="update_pin_title"></b>
    <button id="pin-close" class="small" data-t="close"></button>
  </div>
  <div class="muted small-text" data-t="update_pin_hint"></div>
  <input id="pin-input" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6">
  <div id="pin-msg" class="muted"></div>
  <div class="row"><button id="pin-ok" class="primary" data-t="update_go"></button></div>
</div>

<!-- ========================================================== the app restarts with the update -->
<div id="restart" class="sheet restart" hidden>
  <div class="restart-box">
    <div class="spinner"></div>
    <b data-t="update_restart_title"></b>
    <div id="restart-msg" class="muted"></div>
  </div>
</div>

<!-- ========================================================== touching up the mask -->
<div id="masker" class="sheet" hidden>
  <div class="sheet-head">
    <b data-t="mask_edit_title"></b>
    <button id="mask-close" class="small" data-t="close"></button>
  </div>
  <div class="muted small-text" data-t="mask_edit_hint"></div>
  <div class="mask-area"><img id="mask-img" alt=""><canvas id="mask-canvas"></canvas></div>
  <div id="mask-tools" class="seg">
    <button data-tool="part" class="on" data-t="mask_tool_part"></button>
    <button data-tool="add" data-t="mask_tool_add"></button>
    <button data-tool="erase" data-t="mask_tool_erase"></button>
  </div>
  <div class="row"><span class="muted" data-t="brush_size"></span><input id="mask-brush" type="range" min="1" max="20" value="5"></div>
  <div class="row wrap">
    <button id="mask-undo" class="small" aria-label="undo">↶</button>
    <button id="mask-redo" class="small" aria-label="redo">↷</button>
    <button id="mask-reset" class="small" data-t="mask_reset"></button>
    <button id="mask-save" class="primary" data-t="save"></button>
  </div>
  <div id="mask-msg" class="muted"></div>
</div>

<div id="pull" hidden>↻</div>
<div id="toast" hidden></div>
<script src="/phone.js"></script>
</body>
</html>
